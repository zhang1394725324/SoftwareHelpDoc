<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>文件下载中心</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 40px;
    }
    h1 {
      text-align: center;
    }
    .file-list {
      max-width: 800px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #eee;
    }
    .file-item:last-child {
      border-bottom: none;
    }
    .btn {
      background: #007bff;
      color: white;
      padding: 6px 12px;
      text-decoration: none;
      border-radius: 5px;
    }
    .btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

<h1>📁 文件下载中心</h1>

<div class="file-list" id="fileList">
  加载中...
</div>

<script>
const owner = "你的用户名";
const repo = "你的仓库名";
const path = "files"; // 目录

const api = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

async function loadFiles() {
  const res = await fetch(api);
  const data = await res.json();

  const container = document.getElementById("fileList");
  container.innerHTML = "";

  data.forEach(file => {
    if (file.type === "file") {
      const div = document.createElement("div");
      div.className = "file-item";

      const name = document.createElement("span");
      name.textContent = file.name;

      const a = document.createElement("a");
      a.className = "btn";
      a.textContent = "下载";
      a.href = file.download_url;
      a.target = "_blank";

      div.appendChild(name);
      div.appendChild(a);

      container.appendChild(div);
    }
  });
}

loadFiles();
</script>

</body>
</html>
