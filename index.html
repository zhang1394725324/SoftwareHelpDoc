<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>软件帮助中心</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- 引入 Font Awesome 图标库 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>

body {
margin: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
background: #f5f6fa;
overflow: hidden;
}

/* 顶部 */
.header {
height: 55px;
background: #0d1117;
color: white;
display: flex;
align-items: center;
padding: 0 15px;
gap: 15px;
box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
z-index: 100; /* 确保顶部栏在最上层 */
position: relative;
}

.menuBtn {
display: flex;
align-items: center;
gap: 6px;
cursor: pointer;
padding: 6px 10px;
border-radius: 6px;
transition: background 0.2s ease-in-out;
}

.menuBtn:hover {
background: #30363d;
}

.menuBtn.active {
background: #1f6feb;
}

/* 三条杠 */
.hamburger span {
display: block;
width: 16px;
height: 2px;
background: white;
margin: 3px 0;
}

/* 当前PDF */
.currentPDF {
flex: 1;
text-align: center;
font-weight: 600;
font-size: 1.1em;
white-space: nowrap; /* 防止标题换行 */
overflow: hidden; /* 隐藏溢出内容 */
text-overflow: ellipsis; /* 显示省略号 */
max-width: 300px; /* 限制标题最大宽度 */
}

/* 搜索 */
.searchBox {
display: flex;
gap: 5px;
align-items: center;
}

.searchBox input {
padding: 7px 10px;
border-radius: 4px;
border: 1px solid #ccc;
outline: none;
font-size: 0.9em;
width: 150px;
transition: border-color 0.2s ease-in-out;
}

.searchBox input:focus {
border-color: #1f6feb;
}

.searchBox button {
padding: 7px 12px;
cursor: pointer;
background: #1f6feb;
color: white;
border: none;
border-radius: 4px;
font-size: 0.9em;
display: flex;
align-items: center;
gap: 5px;
transition: background 0.2s ease-in-out;
}

.searchBox button:hover {
background: #195ac8;
}

/* 侧边栏容器 */
.sidebar-container {
display: flex; /* 使用flex布局让两个侧边栏并排 */
position: fixed;
top: 55px;
left: 0;
bottom: 0;
z-index: 90; /* 确保侧边栏在顶部栏下方，但在阅读器上方 */
}

/* 左侧软件目录 */
.sidebar {
width: 260px;
background: white;
border-right: 1px solid #ddd;
overflow-y: auto;
flex-shrink: 0; /* 防止侧边栏被压缩 */
/* 使用 transform 进行平滑隐藏和显示 */
transform: translateX(0);
transition: transform 0.3s ease-in-out;
}

.sidebar.hidden {
transform: translateX(-100%); /* 完全移出视口 */
}

/* PDF 目录 */
.toc {
width: 260px;
background: #fafafa;
border-right: 1px solid #ddd;
overflow-y: auto;
flex-shrink: 0; /* 防止侧边栏被压缩 */
/* 使用 transform 进行平滑隐藏和显示 */
transform: translateX(0);
transition: transform 0.3s ease-in-out;
}

.toc.hidden {
transform: translateX(-100%); /* 完全移出视口 */
}

/*
为了实现“完全隐藏”（即不占用空间），
我们将不再依赖transform来完全隐藏，
而是当它们被隐藏时，直接应用display: none;
但在过渡时，我们会先通过transform实现动画，
动画结束后再设置display: none;
*/
.sidebar-container .hidden {
display: none; /* 当隐藏时，不占用任何布局空间 */
}
/* 
我们需要修改toggleSidebar函数，
使其在显示时添加一个类来覆盖display: none，
并在隐藏时，在transform动画结束后再添加display: none。
*/


/* 阅读区 */
.viewer {
position: fixed;
top: 55px;
left: 0;
right: 0;
bottom: 0;
background: #525659;
text-align: center;
overflow-y: auto;
transition: margin-left 0.3s ease-in-out;
display: flex; /* 使用 flex 布局 */
flex-direction: column; /* 垂直方向布局 */
}

/* 顶部翻页工具栏 */
.pageHeaderToolbar {
height: 40px;
background: #333;
color: white;
display: flex;
align-items: center;
justify-content: center; /* 居中显示 */
gap: 20px;
padding: 0 15px;
flex-shrink: 0; /* 防止被压缩 */
}

.pageHeaderToolbar button {
padding: 5px 12px;
cursor: pointer;
background: #1f6feb;
color: white;
border: none;
border-radius: 4px;
font-size: 0.9em;
transition: background 0.2s ease-in-out;
}

.pageHeaderToolbar button:hover {
background: #195ac8;
}

.pageHeaderToolbar span {
font-size: 1em;
font-weight: 500;
}

/* PDF Canvas 容器 */
.canvas-container {
flex-grow: 1; /* 占据剩余空间 */
display: flex;
justify-content: center;
align-items: flex-start; /* 将 canvas 顶部对齐 */
padding-top: 20px; /* 顶部内边距 */
padding-bottom: 20px; /* 底部内边距 */
}

canvas {
box-shadow: 0 5px 25px rgba(0, 0, 0, 0.4);
background: white; /* 确保 canvas 背景是白色 */
}

/* 翻页按钮 */
.pageArrow {
position: fixed;
top: 50%;
transform: translateY(-50%);
width: 50px;
height: 80px;
background: rgba(0, 0, 0, 0.3);
color: white;
font-size: 28px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
border-radius: 6px;
z-index: 99; /* 确保在阅读器上方 */
transition: background 0.2s ease-in-out;
}

.pageArrow:hover {
background: rgba(0, 0, 0, 0.5);
}

.leftArrow {
left: var(--viewer-left-margin, 0); /* 使用 CSS 变量控制位置 */
}

.rightArrow {
right: 20px;
}

/* 侧边栏内容样式 */
#softwareList h3 {
padding: 10px 15px;
margin: 0;
background: #f0f2f5;
border-bottom: 1px solid #eee;
font-size: 1.1em;
color: #333;
}

#softwareList a, #toc a {
display: block;
padding: 10px 15px;
cursor: pointer;
color: #333;
text-decoration: none;
border-bottom: 1px solid #eee;
transition: background 0.2s ease-in-out;
}

#softwareList a:hover, #toc a:hover {
background: #e6f3ff;
}

#softwareList a.active-link, #toc a.active-link {
background: #e6f3ff;
font-weight: 600;
color: #1f6feb;
}

#toc h3 {
padding: 10px 15px;
margin: 0;
background: #f0f2f5;
border-bottom: 1px solid #eee;
font-size: 1.1em;
color: #333;
}

/* 加载提示 */
.loading-overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.7);
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
color: white;
font-size: 1.5em;
z-index: 200; /* 确保在所有内容之上 */
transition: opacity 0.3s ease-in-out;
}

.loading-overlay.hidden {
opacity: 0;
pointer-events: none; /* 隐藏后不允许点击 */
}

.spinner {
border: 8px solid rgba(255, 255, 255, 0.3);
border-top: 8px solid #1f6feb;
border-radius: 50%;
width: 60px;
height: 60px;
animation: spin 1s linear infinite;
margin-bottom: 20px;
}

@keyframes spin {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}

</style>

</head>

<body>

<div class="loading-overlay" id="loadingOverlay">
<div class="spinner"></div>
<p>加载中，请稍候...</p>
</div>

<div class="header">
<div class="menuBtn" onclick="toggleSidebar('sidebar')" id="btnSidebar">
<div class="hamburger">
<span></span>
<span></span>
<span></span>
</div>
软件目录
</div>

<div class="menuBtn" onclick="toggleToc()" id="btnToc">
<div class="hamburger">
<span></span>
<span></span>
<span></span>
</div>
目录
</div>

<div class="currentPDF" id="currentPDF">
软件帮助中心
</div>

<div class="searchBox">
<input id="searchBox" placeholder="搜索章节">
<button onclick="search()">
<i class="fas fa-search"></i> 搜索
</button>
</div>
</div>

<!-- 侧边栏容器，包裹两个侧边栏 -->
<div class="sidebar-container">
<div class="sidebar" id="sidebar">
<div id="softwareList"></div>
</div>

<div class="toc" id="tocPanel">
<div id="toc"></div>
</div>
</div>


<div class="viewer" id="pdfViewer">
<div class="pageHeaderToolbar">
<button onclick="prevPage()"><i class="fas fa-arrow-left"></i> 上一页</button>
<span id="pageInfo"></span>
<button onclick="nextPage()">下一页 <i class="fas fa-arrow-right"></i></button>
</div>
<div class="canvas-container">
<canvas id="pdfCanvas"></canvas>
</div>
</div>

<div class="pageArrow leftArrow" onclick="prevPage()">‹</div>
<div class="pageArrow rightArrow" onclick="nextPage()">›</div>

<script>

const owner = "zhang1394725324";
const repo = "SoftwareHelpDoc";

let pdfDoc = null;
let pageNum = 1;
let scale = 1.2;
let currentPdfUrl = null; // 用于跟踪当前加载的 PDF URL

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// 侧边栏状态管理
let sidebarStates = {
sidebar: false, // false 表示隐藏，true 表示显示
tocPanel: false
};

const SIDEBAR_WIDTH = 260; // 定义侧边栏的固定宽度

function updateViewerMargin() {
let margin = 0;
// 根据 sidebarStates 来判断每个侧边栏是否应该贡献边距
if (sidebarStates.sidebar) {
margin += SIDEBAR_WIDTH;
}
if (sidebarStates.tocPanel) {
margin += SIDEBAR_WIDTH;
}

const viewerElement = document.getElementById("pdfViewer");
const leftArrowElement = document.querySelector(".leftArrow");

// 更新 viewer 的 margin-left
viewerElement.style.marginLeft = `${margin}px`;
// 更新左侧翻页按钮的位置，加上一些内边距
leftArrowElement.style.left = `${margin + 20}px`;
}

// 修改 toggleSidebar 函数来更精确地控制 display 属性
function toggleSidebar(panelId) {
const panel = document.getElementById(panelId);
const btn = document.getElementById('btn' + (panelId === 'sidebar' ? 'Sidebar' : 'Toc'));

// 如果侧边栏当前是隐藏的，则显示它
if (panel.classList.contains("hidden")) {
panel.style.display = 'block'; // 先设置为 block 才能进行 transform 动画
setTimeout(() => {
panel.style.transform = 'translateX(0)';
}, 10); // 短暂延迟确保 display 改变后 transform 生效
} else {
// 如果侧边栏当前是显示的，则隐藏它
panel.style.transform = 'translateX(-100%)';
// 在过渡动画结束后再设置 display: none
panel.addEventListener('transitionend', function handler() {
panel.style.display = 'none';
panel.removeEventListener('transitionend', handler);
}, { once: true });
}

btn.classList.toggle("active");
sidebarStates[panelId] = !panel.classList.contains("hidden"); // 更新状态

// 更新 hidden 类
panel.classList.toggle("hidden"); // 仅仅用于 CSS 选择器判断
updateViewerMargin(); // 更新阅读器边距
}

// PDF 目录的切换逻辑独立出来
function toggleToc() {
const tocPanel = document.getElementById("tocPanel");
const btnToc = document.getElementById("btnToc");

// 如果目录当前是隐藏的，尝试加载并显示
if (tocPanel.classList.contains("hidden")) {
if (pdfDoc && document.getElementById("toc").innerHTML.trim() === '<h3>PDF 目录</h3>') {
// 如果 pdfDoc 已加载但 toc 面板内容为空（除了标题），则重新加载目录
loadTOC();
}
}
toggleSidebar('tocPanel'); // 调用通用的切换侧边栏函数
}


/* 自动扫描 */
async function loadFolders() {
const res = await fetch(
`https://api.github.com/repos/${owner}/${repo}/contents`
);
const data = await res.json();
const softwareList = document.getElementById("softwareList");
softwareList.innerHTML = ""; // 清空之前的列表

for (const folder of data) {
if (folder.type == "dir") {
const title = document.createElement("h3");
title.textContent = folder.name;
softwareList.appendChild(title);
await loadPDFs(folder.name, softwareList); // 等待 PDF 加载完成
}
}
hideLoadingOverlay(); // 所有文件夹和PDF加载完成后隐藏加载提示
}

async function loadPDFs(folder, parentElement) {
const res = await fetch(
`https://api.github.com/repos/${owner}/${repo}/contents/${folder}`
);
const files = await res.json();

files.forEach(file => {
if (file.name.endsWith(".pdf")) {
const a = document.createElement("a");
a.textContent = file.name.replace(/\.pdf$/, ''); // 移除 .pdf 后缀
a.href = "#"; // 阻止默认跳转
a.dataset.pdfUrl = file.download_url; // 存储 PDF URL
a.onclick = (e) => {
e.preventDefault(); // 阻止默认行为
// 移除所有 active 样式
document.querySelectorAll("#softwareList a").forEach(link => {
link.classList.remove("active-link");
});
// 添加当前点击的 active 样式
e.target.classList.add("active-link");
loadPDF(file.download_url, file.name);
};
parentElement.appendChild(a);
}
});
}

/* 加载PDF */
function loadPDF(url, name) {
if (currentPdfUrl === url) {
console.log("PDF already loaded:", url);
return; // 如果是同一个 PDF，则不重新加载
}
currentPdfUrl = url;

document.getElementById("currentPDF").innerText = name.replace(/\.pdf$/, '');
document.getElementById("toc").innerHTML = '<h3>PDF 目录</h3>'; // 清空并重置 TOC 内容

pdfjsLib.getDocument(url).promise.then(pdf => {
pdfDoc = pdf;
pageNum = 1;
renderPage(pageNum);
// 不再此处直接加载 TOC，而是等到用户点击“目录”按钮时再加载
// loadTOC();
}).catch(error => {
console.error("Error loading PDF:", error);
alert("加载 PDF 失败，请稍后再试。");
});
}

function renderPage(num) {
if (!pdfDoc) return; // 确保 pdfDoc 已加载

pdfDoc.getPage(num).then(page => {
const canvas = document.getElementById("pdfCanvas");
const ctx = canvas.getContext("2d");

const viewport = page.getViewport({ scale });

// 自动调整 canvas 大小以适应页面
const desiredWidth = document.querySelector('.canvas-container').offsetWidth * 0.9; // 90% 宽度
const desiredScale = desiredWidth / viewport.width;
const newViewport = page.getViewport({ scale: desiredScale });


canvas.height = newViewport.height;
canvas.width = newViewport.width;

page.render({
canvasContext: ctx,
viewport: newViewport
});

document.getElementById("pageInfo").innerText = `${num} / ${pdfDoc.numPages}`;

// 滚动到 canvas 顶部
document.querySelector('.canvas-container').scrollTo({
top: 0,
behavior: 'smooth'
});

// 更新当前活跃的 TOC 链接
updateActiveTocLink(num);

}).catch(error => {
console.error("Error rendering page:", error);
});
}

function prevPage() {
if (pageNum <= 1) return;
pageNum--;
renderPage(pageNum);
}

function nextPage() {
if (pageNum >= pdfDoc.numPages) return;
pageNum++;
renderPage(pageNum);
}

/* 目录 */
function loadTOC() {
if (!pdfDoc) {
document.getElementById("toc").innerHTML = '<h3>PDF 目录</h3><p style="padding: 10px 15px; color: #666;">请先选择一个 PDF 文件。</p>';
return;
}

pdfDoc.getOutline().then(outline => {
const toc = document.getElementById("toc");
toc.innerHTML = "<h3>PDF 目录</h3>"; // 清空之前的目录并添加标题

function create(item, parent) {
const a = document.createElement("a");
a.textContent = item.title;
a.href = "#"; // 阻止默认跳转
a.onclick = (e) => {
e.preventDefault();
pdfDoc.getDestination(item.dest)
.then(dest => {
if (Array.isArray(dest) && dest.length > 0) {
return pdfDoc.getPageIndex(dest[0]);
} else if (typeof dest === 'string') {
// 如果 dest 是一个字符串，可能是一个命名目的地
return pdfDoc.getPageIndex(dest);
}
return Promise.reject("Invalid destination");
})
.then(index => {
pageNum = index + 1;
renderPage(pageNum);
})
.catch(error => console.error("Error navigating to destination:", error));
};
parent.appendChild(a);

if (item.items && item.items.length > 0) {
// 创建一个子菜单容器
const subItems = document.createElement("div");
subItems.style.paddingLeft = "15px"; // 缩进
item.items.forEach(i => create(i, subItems));
parent.appendChild(subItems);
}
}

if (outline && outline.length > 0) {
outline.forEach(i => create(i, toc));
} else {
toc.innerHTML += '<p style="padding: 10px 15px; color: #666;">此 PDF 没有目录。</p>';
}


}).catch(error => {
console.error("Error loading TOC:", error);
document.getElementById("toc").innerHTML = '<h3>PDF 目录</h3><p style="padding: 10px 15px; color: #666;">加载目录失败。</p>';
});
}

// 更新 PDF 目录中的活跃链接
function updateActiveTocLink(currentPage) {
const tocLinks = document.querySelectorAll("#toc a");
tocLinks.forEach(link => link.classList.remove("active-link"));

if (!pdfDoc) return;

// 遍历目录，找到最接近当前页面的条目
let closestLink = null;
let minDistance = Infinity;

pdfDoc.getOutline().then(outline => {
const flatOutline = [];
function flattenOutline(items) {
if (!items) return;
items.forEach(item => {
flatOutline.push(item);
if (item.items) flattenOutline(item.items);
});
}
flattenOutline(outline);

const promises = flatOutline.map(item => {
return pdfDoc.getDestination(item.dest)
.then(dest => {
if (Array.isArray(dest) && dest.length > 0) {
return pdfDoc.getPageIndex(dest[0]).then(index => ({ item, pageIndex: index + 1 }));
} else if (typeof dest === 'string') {
return pdfDoc.getPageIndex(dest).then(index => ({ item, pageIndex: index + 1 }));
}
return null;
})
.catch(() => null); // 捕获错误，避免中断所有 promise
});

Promise.all(promises).then(results => {
results.forEach(result => {
if (result && result.pageIndex <= currentPage) {
const distance = currentPage - result.pageIndex;
if (distance < minDistance) {
minDistance = distance;
closestLink = result.item;
}
}
});

if (closestLink) {
tocLinks.forEach(link => {
if (link.textContent === closestLink.title) {
link.classList.add("active-link");
// 滚动到活跃链接
link.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
});
}
});
});
}

/* 搜索 */
function search() {
const q = document.getElementById("searchBox").value.toLowerCase();
const tocLinks = document.querySelectorAll("#toc a");

tocLinks.forEach(a => {
a.style.display =
a.textContent.toLowerCase().includes(q)
? "block"
: "none";
});
}

// 加载提示相关函数
function showLoadingOverlay(message = "加载中，请稍候...") {
const overlay = document.getElementById("loadingOverlay");
overlay.querySelector("p").textContent = message;
overlay.classList.remove("hidden");
}

function hideLoadingOverlay() {
const overlay = document.getElementById("loadingOverlay");
overlay.classList.add("hidden");
}


// 初始加载
document.addEventListener('DOMContentLoaded', () => {
showLoadingOverlay("正在加载软件列表..."); // 页面加载时显示加载提示

// 默认设置侧边栏为隐藏状态，并立即设置 display: none
const sidebar = document.getElementById("sidebar");
sidebar.classList.add("hidden");
sidebar.style.transform = 'translateX(-100%)';
sidebar.style.display = 'none'; // 确保不占用空间

const tocPanel = document.getElementById("tocPanel");
tocPanel.classList.add("hidden");
tocPanel.style.transform = 'translateX(-100%)';
tocPanel.style.display = 'none'; // 确保不占用空间

document.getElementById("btnSidebar").classList.remove("active");
document.getElementById("btnToc").classList.remove("active");

// 初始化 PDF 目录内容，避免空白
document.getElementById("toc").innerHTML = '<h3>PDF 目录</h3>';

updateViewerMargin(); // 初始更新边距
loadFolders(); // 开始加载软件列表
});

</script>

</body>

</html>
