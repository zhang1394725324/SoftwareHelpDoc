<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>软件帮助中心</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- 引入 Font Awesome 图标库 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>

body {
margin: 0;
font-family: -apple-system, BlinkMacSystemFont,"Segoe UI",Roboto;
background:#f5f6fa;
overflow:hidden;
}

/* 顶部 */
.header{
height:55px;
background:#0d1117;
color:white;
display:flex;
align-items:center;
padding:0 15px;
gap:15px;
box-shadow:0 2px 5px rgba(0,0,0,.2);
z-index:100;
position:relative;
}

.menuBtn{
display:flex;
align-items:center;
gap:6px;
cursor:pointer;
padding:6px 10px;
border-radius:6px;
transition:background .2s ease-in-out;
}

.menuBtn:hover{
background:#30363d;
}

.menuBtn.active{
background:#1f6feb;
}

/* 三条杠 */
.hamburger span{
display:block;
width:16px;
height:2px;
background:white;
margin:3px 0;
}

/* 当前PDF */
.currentPDF{
flex:1;
text-align:center;
font-weight:600;
font-size:1.1em;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
max-width:300px;
}

/* 搜索 */
.searchBox{
display:flex;
gap:5px;
align-items:center;
}

.searchBox input{
padding:7px 10px;
border-radius:4px;
border:1px solid #ccc;
outline:none;
font-size:.9em;
width:150px;
transition:border-color .2s ease-in-out;
}

.searchBox input:focus{
border-color:#1f6feb;
}

.searchBox button{
padding:7px 12px;
cursor:pointer;
background:#1f6feb;
color:white;
border:none;
border-radius:4px;
font-size:.9em;
display:flex;
align-items:center;
gap:5px;
transition:background .2s ease-in-out;
}

.searchBox button:hover{
background:#195ac8;
}

/* 侧边栏容器 */
.sidebar-container{
display:flex;
position:fixed;
top:55px;
left:0;
bottom:0;
z-index:90;
transition:transform .3s ease-in-out;
}

/* 当sidebar-container被隐藏时 */
.sidebar-container.hidden-container{
display:none;
}


/* 左侧软件目录 */
.sidebar{
width:260px;
background:white;
border-right:1px solid #ddd;
overflow-y:auto;
flex-shrink:0;
transform:translateX(0);
transition:transform .3s ease-in-out;
}

.sidebar.hidden{
transform:translateX(-100%);
}

/* PDF 目录 */
.toc{
width:260px;
background:#fafafa;
border-right:1px solid #ddd;
overflow-y:auto;
flex-shrink:0;
transform:translateX(0);
transition:transform .3s ease-in-out;
}

.toc.hidden{
transform:translateX(-100%);
}


/* 阅读区 */
.viewer{
position:fixed;
top:55px;
left:0;
right:0;
bottom:0;
background:#525659;
text-align:center;
overflow-y:auto;
transition:margin-left .3s ease-in-out;
display:flex;
flex-direction:column;
}

/* 顶部翻页工具栏 */
.pageHeaderToolbar{
height:40px;
background:#333;
color:white;
display:flex;
align-items:center;
justify-content:center;
gap:20px;
padding:0 15px;
flex-shrink:0;
}

.pageHeaderToolbar button{
padding:5px 12px;
cursor:pointer;
background:#1f6feb;
color:white;
border:none;
border-radius:4px;
font-size:.9em;
transition:background .2s ease-in-out;
}

.pageHeaderToolbar button:hover{
background:#195ac8;
}

.pageHeaderToolbar span{
font-size:1em;
font-weight:500;
}

/* PDF Canvas 容器 */
.canvas-container{
flex-grow:1;
display:flex;
justify-content:center;
align-items:flex-start;
padding-top:20px;
padding-bottom:20px;
}

canvas{
box-shadow:0 5px 25px rgba(0,0,0,.4);
background:white;
}

/* 翻页按钮 */
.pageArrow{
position:fixed;
top:50%;
transform:translateY(-50%);
width:50px;
height:80px;
background:rgba(0,0,0,.3);
color:white;
font-size:28px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
border-radius:6px;
z-index:99;
transition:background .2s ease-in-out;
}

.pageArrow:hover{
background:rgba(0,0,0,.5);
}

.leftArrow{
left:var(--viewer-left-margin,0);
}

.rightArrow{
right:20px;
}

/* 侧边栏内容样式 */
#softwareList h3{
padding:10px 15px;
margin:0;
background:#f0f2f5;
border-bottom:1px solid #eee;
font-size:1.1em;
color:#333;
}

#softwareList a,#toc a{
display:block;
padding:10px 15px;
cursor:pointer;
color:#333;
text-decoration:none;
border-bottom:1px solid #eee;
transition:background .2s ease-in-out;
}

#softwareList a:hover,#toc a:hover{
background:#e6f3ff;
}

#softwareList a.active-link,#toc a.active-link{
background:#e6f3ff;
font-weight:600;
color:#1f6feb;
}

#toc h3{
padding:10px 15px;
margin:0;
background:#f0f2f5;
border-bottom:1px solid #eee;
font-size:1.1em;
color:#333;
}

/* 加载提示 */
.loading-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
font-size:1.5em;
z-index:200;
transition:opacity .3s ease-in-out;
}

.loading-overlay.hidden{
opacity:0;
pointer-events:none;
}

.spinner{
border:8px solid rgba(255,255,255,.3);
border-top:8px solid #1f6feb;
border-radius:50%;
width:60px;
height:60px;
animation:spin 1s linear infinite;
margin-bottom:20px;
}

@keyframes spin{
0%{transform:rotate(0deg)}
100%{transform:rotate(360deg)}
}

</style>

</head>

<body>

<div class="loading-overlay" id="loadingOverlay">
<div class="spinner"></div>
<p>加载中，请稍候...</p>
</div>

<div class="header">
<div class="menuBtn" onclick="toggleSidebar('sidebar')" id="btnSidebar">
<div class="hamburger">
<span></span>
<span></span>
<span></span>
</div>
软件目录
</div>

<div class="menuBtn" onclick="toggleToc()" id="btnToc">
<div class="hamburger">
<span></span>
<span></span>
<span></span>
</div>
目录
</div>

<div class="currentPDF" id="currentPDF">
软件帮助中心
</div>

<div class="searchBox">
<input id="searchBox" placeholder="搜索章节">
<button onclick="search()">
<i class="fas fa-search"></i> 搜索
</button>
</div>
</div>

<!-- 侧边栏容器，包裹两个侧边栏 -->
<div class="sidebar-container" id="sidebarContainer">
<div class="sidebar" id="sidebar">
<div id="softwareList"></div>
</div>

<div class="toc" id="tocPanel">
<div id="toc"></div>
</div>
</div>


<div class="viewer" id="pdfViewer">
<div class="pageHeaderToolbar">
<button onclick="prevPage()"><i class="fas fa-arrow-left"></i> 上一页</button>
<span id="pageInfo"></span>
<button onclick="nextPage()">下一页 <i class="fas fa-arrow-right"></i></button>
</div>
<div class="canvas-container">
<canvas id="pdfCanvas"></canvas>
</div>
</div>

<div class="pageArrow leftArrow" onclick="prevPage()">‹</div>
<div class="pageArrow rightArrow" onclick="nextPage()">›</div>

<script>

const owner = "zhang1394725324";
const repo = "SoftwareHelpDoc";

let pdfDoc = null;
let pageNum = 1;
let scale = 1.2;
let currentPdfUrl = null;

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let sidebarStates = {
sidebar: false,
tocPanel: false
};

const SIDEBAR_WIDTH = 260;

function updateViewerMargin() {
let margin = 0;
if (sidebarStates.sidebar) {
margin += SIDEBAR_WIDTH;
}
if (sidebarStates.tocPanel) {
margin += SIDEBAR_WIDTH;
}

const viewerElement = document.getElementById("pdfViewer");
const leftArrowElement = document.querySelector(".leftArrow");
const sidebarContainer = document.getElementById("sidebarContainer");

viewerElement.style.marginLeft = `${margin}px`;
leftArrowElement.style.left = `${margin + 20}px`;

if (!sidebarStates.sidebar && !sidebarStates.tocPanel) {
sidebarContainer.classList.add('hidden-container');
} else {
sidebarContainer.classList.remove('hidden-container');
}
}

function handleTransitionEnd(event) {
const panel = event.target;
if (panel.style.transform === 'translateX(-100%)') {
panel.style.display = 'none';
}
panel.removeEventListener('transitionend', handleTransitionEnd);
}

function toggleSidebar(panelId) {
const panel = document.getElementById(panelId);
const btn = document.getElementById('btn' + (panelId === 'sidebar' ? 'Sidebar' : 'Toc'));

const isCurrentlyVisible = sidebarStates[panelId];

if (!isCurrentlyVisible) {
panel.style.display = 'block';
requestAnimationFrame(() => {
panel.style.transform = 'translateX(0)';
});
panel.removeEventListener('transitionend', handleTransitionEnd);
} else {
panel.style.transform = 'translateX(-100%)';
panel.addEventListener('transitionend', handleTransitionEnd, { once: true });
}

btn.classList.toggle("active");
sidebarStates[panelId] = !isCurrentlyVisible;

updateViewerMargin();
}

function toggleToc() {
const tocPanel = document.getElementById("tocPanel");
if (!sidebarStates.tocPanel) {
if (pdfDoc && document.getElementById("toc").innerHTML.trim() === '<h3>PDF 目录</h3>') {
loadTOC();
}
}
toggleSidebar('tocPanel');
}


/* 自动扫描 */
async function loadFolders() {
try {
const res = await fetch(
`https://api.github.com/repos/${owner}/${repo}/contents`
);

if (!res.ok) {
const errorData = await res.json();
throw new Error(`GitHub API Error: ${res.status} - ${errorData.message || res.statusText}`);
}

const data = await res.json();
const softwareList = document.getElementById("softwareList");
softwareList.innerHTML = "";

for (const folder of data) {
if (folder.type == "dir") {
const title = document.createElement("h3");
title.textContent = folder.name;
softwareList.appendChild(title);
await loadPDFs(folder.name, softwareList);
}
}
} catch (error) {
console.error("Error loading folders from GitHub:", error);
showLoadingOverlay(`加载软件目录失败: ${error.message || "未知错误"}. 请检查网络或API限制。`);
} finally {
hideLoadingOverlay();
}
}

async function loadPDFs(folder, parentElement) {
try {
const res = await fetch(
`https://api.github.com/repos/${owner}/${repo}/contents/${folder}`
);

if (!res.ok) {
const errorData = await res.json();
throw new Error(`GitHub API Error: ${res.status} - ${errorData.message || res.statusText}`);
}

const files = await res.json();

files.forEach(file => {
if (file.name.endsWith(".pdf")) {
const a = document.createElement("a");
a.textContent = file.name.replace(/\.pdf$/, '');
a.href = "#";
a.dataset.pdfUrl = file.download_url;
a.onclick = (e) => {
e.preventDefault();
document.querySelectorAll("#softwareList a").forEach(link => {
link.classList.remove("active-link");
});
e.target.classList.add("active-link");
loadPDF(file.download_url, file.name);
};
parentElement.appendChild(a);
}
});
} catch (error) {
console.error(`Error loading PDFs for folder ${folder}:`, error);
// 这里不隐藏主加载提示，因为 loadFolders 的 finally 会处理
// 但可以考虑对单个文件夹加载失败进行提示
}
}

/* 加载PDF */
function loadPDF(url, name) {
if (currentPdfUrl === url) {
console.log("PDF already loaded:", url);
return;
}
currentPdfUrl = url;

document.getElementById("currentPDF").innerText = name.replace(/\.pdf$/, '');
document.getElementById("toc").innerHTML = '<h3>PDF 目录</h3>'; // 清空并重置 TOC 内容

pdfjsLib.getDocument(url).promise.then(pdf => {
pdfDoc = pdf;
pageNum = 1;
renderPage(pageNum);
}).catch(error => {
console.error("Error loading PDF:", error);
// 弹窗显示更详细的错误信息
let errorMessage = `加载 PDF "${name}" 失败: `;
if (error instanceof Error) {
errorMessage += error.message;
} else if (typeof error === 'object' && error !== null && error.name && error.message) {
errorMessage += `${error.name}: ${error.message}`;
} else {
errorMessage += "未知错误。请检查 PDF 文件是否损坏或网络连接。";
}
alert(errorMessage);
});
}

function renderPage(num) {
if (!pdfDoc) return;

pdfDoc.getPage(num).then(page => {
const canvas = document.getElementById("pdfCanvas");
const ctx = canvas.getContext("2d");

const viewport = page.getViewport({ scale });

const desiredWidth = document.querySelector('.canvas-container').offsetWidth * 0.9;
const desiredScale = desiredWidth / viewport.width;
const newViewport = page.getViewport({ scale: desiredScale });

canvas.height = newViewport.height;
canvas.width = newViewport.width;

page.render({
canvasContext: ctx,
viewport: newViewport
});

document.getElementById("pageInfo").innerText = `${num} / ${pdfDoc.numPages}`;

document.querySelector('.canvas-container').scrollTo({
top: 0,
behavior: 'smooth'
});

updateActiveTocLink(num);

}).catch(error => {
console.error("Error rendering page:", error);
alert(`渲染页面 ${num} 失败: ${error.message || "未知错误"}`);
});
}

function prevPage() {
if (pageNum <= 1) return;
pageNum--;
renderPage(pageNum);
}

function nextPage() {
if (pageNum >= pdfDoc.numPages) return;
pageNum++;
renderPage(pageNum);
}

/* 目录 */
function loadTOC() {
if (!pdfDoc) {
document.getElementById("toc").innerHTML = '<h3>PDF 目录</h3><p style="padding: 10px 15px; color: #666;">请先选择一个 PDF 文件。</p>';
return;
}

pdfDoc.getOutline().then(outline => {
const toc = document.getElementById("toc");
toc.innerHTML = "<h3>PDF 目录</h3>";

function create(item, parent) {
const a = document.createElement("a");
a.textContent = item.title;
a.href = "#";
a.onclick = (e) => {
e.preventDefault();
// 处理不同类型的目的地格式
pdfDoc.getDestination(item.dest)
.then(dest => {
if (dest === null) {
console.warn(`Destination for "${item.title}" is null. Cannot navigate.`);
return Promise.reject("Destination is null");
}

let pageRef;
// dest 可以是一个数组 [pageRef, ...] 或一个命名字符串
if (Array.isArray(dest)) {
pageRef = dest[0]; // 第一个元素通常是页面的 PDFRef
} else if (typeof dest === 'string') {
// 如果是命名目的地，pdf.js 会自动处理为正确的 PDFRef
pageRef = dest;
} else {
console.warn(`Unsupported destination format for "${item.title}":`, dest);
return Promise.reject("Unsupported destination format");
}

// getPageIndex 期望一个 PDFRef 或命名字符串
return pdfDoc.getPageIndex(pageRef);
})
.then(index => {
pageNum = index + 1; // 转换为基于1的页码
renderPage(pageNum);
})
.catch(error => {
console.error(`Error navigating to "${item.title}":`, error);
alert(`无法跳转到目录章节 "${item.title}"。原因: ${error.message || "未知错误"}`);
});
};
parent.appendChild(a);

if (item.items && item.items.length > 0) {
const subItems = document.createElement("div");
subItems.style.paddingLeft = "15px";
item.items.forEach(i => create(i, subItems));
parent.appendChild(subItems);
}
}

if (outline && outline.length > 0) {
outline.forEach(i => create(i, toc));
} else {
toc.innerHTML += '<p style="padding: 10px 15px; color: #666;">此 PDF 没有目录。</p>';
}


}).catch(error => {
console.error("Error loading TOC:", error);
document.getElementById("toc").innerHTML = `<h3>PDF 目录</h3><p style="padding: 10px 15px; color: #666;">加载目录失败: ${error.message || "未知错误"}</p>`;
});
}

function updateActiveTocLink(currentPage) {
const tocLinks = document.querySelectorAll("#toc a");
tocLinks.forEach(link => link.classList.remove("active-link"));

if (!pdfDoc) return;

// We need a robust way to map outline items to page numbers
// Cache results if possible to avoid re-calculating on every page render
if (!pdfDoc._outlinePageMap) {
pdfDoc._outlinePageMap = new Map();
}

pdfDoc.getOutline().then(outline => {
const flatOutline = [];
function flattenOutline(items) {
if (!items) return;
items.forEach(item => {
flatOutline.push(item);
if (item.items) flattenOutline(item.items);
});
}
flattenOutline(outline);

const promises = flatOutline.map(item => {
if (pdfDoc._outlinePageMap.has(item)) {
return Promise.resolve({ item, pageIndex: pdfDoc._outlinePageMap.get(item) });
}

return pdfDoc.getDestination(item.dest)
.then(dest => {
if (dest === null) return null;

let pageRef;
if (Array.isArray(dest)) {
pageRef = dest[0];
} else if (typeof dest === 'string') {
pageRef = dest;
} else {
return null;
}
return pdfDoc.getPageIndex(pageRef)
.then(index => {
const pageNum = index + 1;
pdfDoc._outlinePageMap.set(item, pageNum); // Cache the result
return { item, pageIndex: pageNum };
})
.catch(() => null);
})
.catch(() => null);
});

Promise.all(promises).then(results => {
let closestLink = null;
let minDistance = Infinity;

results.forEach(result => {
if (result && result.pageIndex <= currentPage) {
const distance = currentPage - result.pageIndex;
// Prioritize closer links, then links that appeared earlier in the outline (smaller index in flatOutline)
if (distance < minDistance || (distance === minDistance && flatOutline.indexOf(result.item) < flatOutline.indexOf(closestLink))) {
minDistance = distance;
closestLink = result.item;
}
}
});

if (closestLink) {
tocLinks.forEach(link => {
if (link.textContent === closestLink.title) {
link.classList.add("active-link");
link.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
});
}
});
});
}

/* 搜索 */
function search() {
const q = document.getElementById("searchBox").value.toLowerCase();
const tocLinks = document.querySelectorAll("#toc a");

tocLinks.forEach(a => {
a.style.display =
a.textContent.toLowerCase().includes(q)
? "block"
: "none";
});
}

function showLoadingOverlay(message = "加载中，请稍候...") {
const overlay = document.getElementById("loadingOverlay");
overlay.querySelector("p").textContent = message;
overlay.classList.remove("hidden");
}

function hideLoadingOverlay() {
const overlay = document.getElementById("loadingOverlay");
overlay.classList.add("hidden");
}


// 初始加载
document.addEventListener('DOMContentLoaded', () => {
showLoadingOverlay("正在加载软件列表...");

const sidebar = document.getElementById("sidebar");
sidebar.style.transform = 'translateX(-100%)';
sidebar.style.display = 'none';

const tocPanel = document.getElementById("tocPanel");
tocPanel.style.transform = 'translateX(-100%)';
tocPanel.style.display = 'none';

document.getElementById("btnSidebar").classList.remove("active");
document.getElementById("btnToc").classList.remove("active");

document.getElementById("toc").innerHTML = '<h3>PDF 目录</h3>';

updateViewerMargin();
loadFolders();
});

</script>

</body>

</html>
