<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>软件帮助中心</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#f5f6f8;
overflow:hidden;
}

.header{
height:60px;
background:#0d1117;
color:white;
display:flex;
align-items:center;
padding:0 20px;
font-size:18px;
}

.container{
display:flex;
height:calc(100vh - 60px);
}

/* 左侧软件列表 */
.software-list{
width:220px;
background:#ffffff;
border-right:1px solid #e5e5e5;
overflow:auto;
padding:15px;
}

.software-list h3{
font-size:13px;
color:#666;
margin-top:15px;
}

.software-list a{

display:block;
padding:8px 10px;
text-decoration:none;
color:#333;
border-radius:6px;
font-size:14px;
}

.software-list a:hover{
background:#f1f3f5;
}

/* 目录 */
.toc{
width:260px;
background:#fafafa;
border-right:1px solid #e5e5e5;
overflow:auto;
padding:15px;
}

.toc h3{
font-size:13px;
color:#666;
}

.toc a{

display:block;
padding:6px;
text-decoration:none;
color:#333;
border-radius:5px;
font-size:13px;
}

.toc a:hover{
background:#ececec;
}

/* PDF区域 */
.viewer{
flex:1;
background:#525659;
overflow:auto;
text-align:center;
}

canvas{
margin:10px auto;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

.toolbar{
height:45px;
background:white;
border-bottom:1px solid #ddd;
display:flex;
align-items:center;
padding:0 10px;
}

button{
margin-right:10px;
padding:5px 12px;
border:1px solid #ccc;
background:white;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#f1f1f1;
}

</style>

</head>

<body>

<div class="header">
📘 软件帮助中心
</div>

<div class="container">

<!-- 软件列表 -->
<div class="software-list" id="softwareList">

<h3>Rhino</h3>
<a onclick="loadPDF('rhino/rhino_help.pdf')">Rhino 帮助文档</a>

<h3>Grasshopper</h3>
<a onclick="loadPDF('grasshopper/grasshopper_help.pdf')">Grasshopper 文档</a>

<h3>Kangaroo2</h3>
<a onclick="loadPDF('kangaroo2/kangaroo2_help.pdf')">Kangaroo2 文档</a>

</div>

<!-- 目录 -->
<div class="toc">
<h3>目录</h3>
<div id="toc"></div>
</div>

<!-- PDF -->
<div class="viewer">

<div class="toolbar">
<button onclick="prevPage()">上一页</button>
<button onclick="nextPage()">下一页</button>
<span id="pageInfo"></span>
</div>

<canvas id="pdfCanvas"></canvas>

</div>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'

let pdfDoc = null
let pageNum = 1
let scale = 1.3

function loadPDF(url){

pdfjsLib.getDocument(url).promise.then(function(pdf){

pdfDoc = pdf
pageNum = 1
renderPage(pageNum)
loadTOC()

})

}

function renderPage(num){

pdfDoc.getPage(num).then(function(page){

let canvas = document.getElementById('pdfCanvas')
let ctx = canvas.getContext('2d')

let viewport = page.getViewport({scale:scale})

canvas.height = viewport.height
canvas.width = viewport.width

page.render({canvasContext:ctx,viewport:viewport})


document.getElementById('pageInfo').innerText =
`第 ${num} 页 / ${pdfDoc.numPages}`

})

}

function prevPage(){
if(pageNum<=1) return
pageNum--
renderPage(pageNum)
}

function nextPage(){
if(pageNum>=pdfDoc.numPages) return
pageNum++
renderPage(pageNum)
}


// 自动获取目录
function loadTOC(){

pdfDoc.getOutline().then(function(outline){

let toc = document.getElementById('toc')
toc.innerHTML=''

if(!outline) return

outline.forEach(function(item){

let div = document.createElement('a')
div.textContent = item.title


div.onclick = function(){

pdfDoc.getDestination(item.dest).then(function(dest){

pdfDoc.getPageIndex(dest[0]).then(function(pageIndex){

pageNum = pageIndex + 1
renderPage(pageNum)

})

})

}


toc.appendChild(div)

})

})

}


// 默认加载
loadPDF('rhino/rhino_help.pdf')

</script>

</body>
</html>
