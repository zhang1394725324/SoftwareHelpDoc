<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>软件帮助中心</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  overflow:hidden;
}

.header{
  height:55px;
  background:#0d1117;
  color:white;
  display:flex;
  align-items:center;
  padding:0 20px;
  font-size:18px;
}

.container{
  display:flex;
  height:calc(100vh - 55px);
}

/* 软件列表 */
.sidebar{
  width:260px;
  background:#fff;
  border-right:1px solid #ddd;
  overflow:auto;
  padding:15px;
}

.sidebar h3{
  font-size:14px;
  margin-top:15px;
  color:#666;
}

.sidebar a{
  display:block;
  padding:6px 10px;
  text-decoration:none;
  color:#333;
  border-radius:5px;
  font-size:13px;
  cursor:pointer;
}

.sidebar a:hover{
  background:#f1f3f5;
}

/* 目录 */
.toc{
  width:260px;
  background:#fafafa;
  border-right:1px solid #ddd;
  overflow:auto;
  padding:15px;
}

.toc a{
  display:block;
  padding:5px;
  font-size:13px;
  cursor:pointer;
}

/* PDF */
.viewer{
  flex:1;
  background:#525659;
  overflow:auto;
  text-align:center;
}

canvas{
  margin:10px auto;
  box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

.toolbar{
  background:white;
  padding:10px;
}

button{
  margin-right:10px;
}
</style>

</head>

<body>

<div class="header">
📘 软件帮助中心
</div>

<div class="container">

<div class="sidebar" id="softwareList"></div>

<div class="toc">
<h3>目录</h3>
<div id="toc"></div>
</div>

<div class="viewer">

<div class="toolbar">
<button onclick="prevPage()">上一页</button>
<button onclick="nextPage()">下一页</button>
<span id="pageInfo"></span>
</div>

<canvas id="pdfCanvas"></canvas>

</div>

</div>

<script>
// GitHub 仓库信息
const owner = "zhang1394725324"
const repo = "SoftwareHelpDoc"
const branch = "main"

// 扫描文件夹并生成软件列表
async function loadFolders(){
  const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`);
  const data = await res.json();
  const sidebar = document.getElementById("softwareList");

  data.forEach(item=>{
    if(item.type==="dir"){
      loadPDFs(item.name);
    }
  })
}

// 扫描文件夹里的 PDF
async function loadPDFs(folder){
  const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${folder}?ref=${branch}`);
  const files = await res.json();
  const sidebar = document.getElementById("softwareList");
  const title = document.createElement("h3");
  title.textContent = folder;
  sidebar.appendChild(title);

  files.forEach(file=>{
    if(file.name.endsWith(".pdf")){
      const link = document.createElement("a");
      link.textContent = file.name;
      link.onclick=()=>{ loadPDF(file.download_url) }
      sidebar.appendChild(link);
    }
  })
}

// PDF.js 初始化
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdfDoc=null, pageNum=1, scale=1.2;

// 加载 PDF
function loadPDF(url){
  pdfjsLib.getDocument(url).promise.then(pdf=>{
    pdfDoc = pdf;
    pageNum = 1;
    renderPage(pageNum);
    loadTOC();
  })
}

// 渲染页码
function renderPage(num){
  pdfDoc.getPage(num).then(page=>{
    const canvas=document.getElementById("pdfCanvas")
    const ctx=canvas.getContext("2d")
    const viewport=page.getViewport({scale})
    canvas.height=viewport.height
    canvas.width=viewport.width
    page.render({canvasContext:ctx,viewport})
    document.getElementById("pageInfo").innerText=`第 ${num} 页 / ${pdfDoc.numPages}`
  })
}

function prevPage(){ if(pageNum<=1)return; pageNum--; renderPage(pageNum) }
function nextPage(){ if(pageNum>=pdfDoc.numPages)return; pageNum++; renderPage(pageNum) }

// 自动生成 PDF 目录
function loadTOC(){
  pdfDoc.getOutline().then(outline=>{
    const toc=document.getElementById("toc")
    toc.innerHTML=""
    if(!outline)return
    outline.forEach(item=>{
      const link=document.createElement("a")
      link.textContent=item.title
      link.onclick=()=>{
        pdfDoc.getDestination(item.dest)
        .then(dest=>{
          pdfDoc.getPageIndex(dest[0])
          .then(index=>{
            pageNum=index+1
            renderPage(pageNum)
          })
        })
      }
      toc.appendChild(link)
    })
  })
}

// 默认加载
loadFolders()
</script>

</body>
</html>
