<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>软件帮助中心</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
overflow:hidden;
background:#f5f6fa;
}

/* 顶部 */

.header{

height:55px;
background:#0d1117;
color:white;
display:flex;
align-items:center;
padding:0 15px;
gap:15px;

}

/* 三条杠按钮 */

.menuBtn{

display:flex;
align-items:center;
gap:6px;
cursor:pointer;
padding:6px 12px;
border-radius:6px;
transition:.2s;

}

.menuBtn:hover{

background:#30363d;

}

.menuBtn.active{

background:#1f6feb;

}

.hamburger span{

display:block;
width:16px;
height:2px;
background:white;
margin:3px 0;

}

/* 当前PDF */

.currentPDF{

flex:1;
text-align:center;
font-weight:600;

}

/* 搜索 */

.searchBox{

display:flex;
align-items:center;
gap:6px;

}

.searchBox input{

padding:6px;
border-radius:4px;
border:none;
width:180px;

}

.searchBtn{

display:flex;
align-items:center;
gap:4px;
padding:6px 10px;
cursor:pointer;
border-radius:5px;
background:#30363d;
}

.searchBtn:hover{

background:#1f6feb;

}

/* 侧边栏 */

.sidebar{

position:fixed;
top:55px;
bottom:0;
width:260px;
background:white;
overflow:auto;
border-right:1px solid #ddd;
transition:.3s;

}

#sidebar{

left:0;

}

#tocPanel{

left:260px;

}

/* 隐藏 */

.sidebar.hidden{

transform:translateX(-260px);

}

/* PDF区 */

.viewer{

position:fixed;
top:55px;
right:0;
bottom:0;
left:520px;
background:#525659;
overflow:auto;
text-align:center;
transition:.3s;

}

/* 响应 */

.viewer.full1{

left:260px;

}

.viewer.full2{

left:0;

}

/* PDF */

canvas{

margin:20px auto;
box-shadow:0 5px 20px rgba(0,0,0,.4);

}

/* 翻页箭头 */

.pageArrow{

position:fixed;
top:50%;
transform:translateY(-50%);
width:45px;
height:70px;
background:rgba(0,0,0,.3);
color:white;
font-size:28px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
border-radius:6px;

}

.leftArrow{

left:540px;

}

.rightArrow{

right:20px;

}

/* 底部工具栏 */

.pageToolbar{

position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,.5);
color:white;
padding:8px 15px;
border-radius:8px;
display:flex;
gap:15px;
align-items:center;

}

button{

cursor:pointer;

}

a{

display:block;
padding:6px 10px;
cursor:pointer;

}

a:hover{

background:#eee;

}

.active{

background:#e6f3ff;

}

</style>

</head>

<body>

<div class="header">

<div class="menuBtn" onclick="toggleSidebar()" id="btnSidebar">

<div class="hamburger">
<span></span>
<span></span>
<span></span>
</div>

软件目录

</div>

<div class="menuBtn" onclick="toggleToc()" id="btnToc">

<div class="hamburger">
<span></span>
<span></span>
<span></span>
</div>

PDF目录

</div>

<div class="currentPDF" id="currentPDF">

软件帮助中心

</div>

<div class="searchBox">

<input id="searchBox" placeholder="搜索章节">

<div class="searchBtn" onclick="search()">

🔍 搜索

</div>

</div>

</div>

<div class="sidebar" id="sidebar">

<div id="softwareList"></div>

</div>

<div class="sidebar" id="tocPanel">

<div id="toc"></div>

</div>

<div class="viewer" id="viewer">

<canvas id="pdfCanvas"></canvas>

</div>

<div class="pageArrow leftArrow" onclick="prevPage()">‹</div>
<div class="pageArrow rightArrow" onclick="nextPage()">›</div>

<div class="pageToolbar">

<button onclick="prevPage()">上一页</button>

<span id="pageInfo">0 / 0</span>

<button onclick="nextPage()">下一页</button>

</div>

<script>

const owner="zhang1394725324"
const repo="SoftwareHelpDoc"

let pdfDoc=null
let pageNum=1

let sidebarOpen=true
let tocOpen=true

pdfjsLib.GlobalWorkerOptions.workerSrc=
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'

function updateViewer(){

const viewer=document.getElementById("viewer")

if(sidebarOpen && tocOpen){

viewer.className="viewer"

}else if(sidebarOpen || tocOpen){

viewer.className="viewer full1"

}else{

viewer.className="viewer full2"

}

}

/* 软件目录 */

function toggleSidebar(){

sidebarOpen=!sidebarOpen

document.getElementById("sidebar")
.classList.toggle("hidden")

document.getElementById("btnSidebar")
.classList.toggle("active")

updateViewer()

}

/* PDF目录 */

function toggleToc(){

tocOpen=!tocOpen

document.getElementById("tocPanel")
.classList.toggle("hidden")

document.getElementById("btnToc")
.classList.toggle("active")

updateViewer()

}

/* 自动扫描 */

async function loadFolders(){

const res=await fetch(
`https://api.github.com/repos/${owner}/${repo}/contents`
)

const data=await res.json()

data.forEach(folder=>{

if(folder.type=="dir"){

loadPDFs(folder.name)

}

})

}

async function loadPDFs(folder){

const res=await fetch(
`https://api.github.com/repos/${owner}/${repo}/contents/${folder}`
)

const files=await res.json()

const list=document.getElementById("softwareList")

const title=document.createElement("h3")
title.textContent=folder

list.appendChild(title)

files.forEach(file=>{

if(file.name.endsWith(".pdf")){

const a=document.createElement("a")

a.textContent=file.name

a.onclick=()=>loadPDF(file.download_url,file.name)

list.appendChild(a)

}

})

}

/* 加载PDF */

function loadPDF(url,name){

document.getElementById("currentPDF")
.innerText=name

pdfjsLib.getDocument(url).promise.then(pdf=>{

pdfDoc=pdf
pageNum=1

renderPage(pageNum)
loadTOC()

})

}

/* 渲染 */

function renderPage(num){

pdfDoc.getPage(num).then(page=>{

const canvas=document.getElementById("pdfCanvas")

const ctx=canvas.getContext("2d")

const viewport=page.getViewport({scale:1.2})

canvas.height=viewport.height
canvas.width=viewport.width

page.render({

canvasContext:ctx,
viewport

})

document.getElementById("pageInfo")
.innerText=`${num} / ${pdfDoc.numPages}`

})

}

function prevPage(){

if(pageNum<=1)return

pageNum--

renderPage(pageNum)

}

function nextPage(){

if(pageNum>=pdfDoc.numPages)return

pageNum++

renderPage(pageNum)

}

/* 目录 */

function loadTOC(){

pdfDoc.getOutline().then(outline=>{

const toc=document.getElementById("toc")

toc.innerHTML=""

function create(item,parent){

const a=document.createElement("a")

a.textContent=item.title

a.onclick=()=>{

pdfDoc.getDestination(item.dest)
.then(dest=>pdfDoc.getPageIndex(dest[0]))
.then(index=>{

pageNum=index+1

renderPage(pageNum)

})

}

parent.appendChild(a)

if(item.items){

item.items.forEach(i=>create(i,parent))

}

}

outline.forEach(i=>create(i,toc))

})

}

/* 搜索 */

function search(){

const q=document.getElementById("searchBox")
.value.toLowerCase()

document.querySelectorAll("#toc a")
.forEach(a=>{

a.style.display=
a.textContent.toLowerCase().includes(q)
?"block":"none"

})

}

loadFolders()

</script>

</body>

</html>
