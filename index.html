<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>软件帮助中心</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#f5f6fa;
overflow:hidden;
}

/* 顶部 */

.header{

height:55px;
background:#0d1117;
color:white;
display:flex;
align-items:center;
padding:0 15px;
gap:15px;

}

.menuBtn{

display:flex;
align-items:center;
gap:6px;
cursor:pointer;
padding:6px 10px;
border-radius:6px;

}

.menuBtn:hover{

background:#30363d;

}

.menuBtn.active{

background:#1f6feb;

}

/* 三条杠 */

.hamburger span{

display:block;
width:16px;
height:2px;
background:white;
margin:3px 0;

}

/* 当前PDF */

.currentPDF{

flex:1;
text-align:center;
font-weight:600;

}

/* 搜索 */

.searchBox{

display:flex;
gap:5px;

}

.searchBox input{

padding:5px;
border-radius:4px;
border:none;

}

.searchBox button{

padding:5px 10px;
cursor:pointer;

}

/* 左侧 */

.sidebar{

position:fixed;
top:55px;
left:0;
bottom:0;
width:260px;
background:white;
border-right:1px solid #ddd;
overflow:auto;
transition:.3s;

}

.sidebar.hidden{

transform:translateX(-260px);

}

/* 目录 */

.toc{

position:fixed;
top:55px;
left:260px;
bottom:0;
width:260px;
background:#fafafa;
border-right:1px solid #ddd;
overflow:auto;
transition:.3s;

}

.toc.hidden{

transform:translateX(-260px);

}

/* 阅读区 */

.viewer{

margin-left:520px;
margin-top:55px;
height:calc(100vh - 55px);
overflow:auto;
background:#525659;
text-align:center;
transition:.3s;

}

canvas{

margin:20px auto;
box-shadow:0 5px 25px rgba(0,0,0,.4);

}

/* 翻页按钮 */

.pageArrow{

position:fixed;
top:50%;
transform:translateY(-50%);
width:50px;
height:80px;
background:rgba(0,0,0,.3);
color:white;
font-size:28px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
border-radius:6px;

}

.leftArrow{

left:520px;

}

.rightArrow{

right:20px;

}

/* 底部翻页 */

.pageToolbar{

color:white;
margin-bottom:20px;

}

button{

cursor:pointer;

}

a{

display:block;
padding:6px 10px;
cursor:pointer;

}

a:hover{

background:#eee;

}

.active{

background:#e6f3ff;

}

</style>

</head>

<body>

<div class="header">

<div class="menuBtn" onclick="toggleSidebar()" id="btnSidebar">

<div class="hamburger">

<span></span>
<span></span>
<span></span>

</div>

软件目录

</div>

<div class="menuBtn" onclick="toggleToc()" id="btnToc">

<div class="hamburger">

<span></span>
<span></span>
<span></span>

</div>

目录

</div>

<div class="currentPDF" id="currentPDF">

软件帮助中心

</div>

<div class="searchBox">

<input id="searchBox" placeholder="搜索章节">

<button onclick="search()">🔍</button>

</div>

</div>

<div class="sidebar" id="sidebar">

<div id="softwareList"></div>

</div>

<div class="toc" id="tocPanel">

<div id="toc"></div>

</div>

<div class="viewer">

<canvas id="pdfCanvas"></canvas>

<div class="pageToolbar">

<button onclick="prevPage()">上一页</button>

<span id="pageInfo"></span>

<button onclick="nextPage()">下一页</button>

</div>

</div>

<div class="pageArrow leftArrow" onclick="prevPage()">‹</div>
<div class="pageArrow rightArrow" onclick="nextPage()">›</div>

<script>

const owner="zhang1394725324"
const repo="SoftwareHelpDoc"

let pdfDoc=null
let pageNum=1
let scale=1.2

pdfjsLib.GlobalWorkerOptions.workerSrc=
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'

function toggleSidebar(){

document.getElementById("sidebar")
.classList.toggle("hidden")

document.getElementById("btnSidebar")
.classList.toggle("active")

}

function toggleToc(){

document.getElementById("tocPanel")
.classList.toggle("hidden")

document.getElementById("btnToc")
.classList.toggle("active")

}

/* 自动扫描 */

async function loadFolders(){

const res=await fetch(
`https://api.github.com/repos/${owner}/${repo}/contents`
)

const data=await res.json()

data.forEach(folder=>{

if(folder.type=="dir"){

loadPDFs(folder.name)

}

})

}

async function loadPDFs(folder){

const res=await fetch(
`https://api.github.com/repos/${owner}/${repo}/contents/${folder}`
)

const files=await res.json()

const list=document.getElementById("softwareList")

const title=document.createElement("h3")
title.textContent=folder

list.appendChild(title)

files.forEach(file=>{

if(file.name.endsWith(".pdf")){

const a=document.createElement("a")

a.textContent=file.name

a.onclick=()=>loadPDF(file.download_url,file.name)

list.appendChild(a)

}

})

}

/* 加载PDF */

function loadPDF(url,name){

document.getElementById("currentPDF")
.innerText=name

pdfjsLib.getDocument(url).promise.then(pdf=>{

pdfDoc=pdf
pageNum=1

renderPage(pageNum)

loadTOC()

})

}

function renderPage(num){

pdfDoc.getPage(num).then(page=>{

const canvas=document.getElementById("pdfCanvas")

const ctx=canvas.getContext("2d")

const viewport=page.getViewport({scale})

canvas.height=viewport.height
canvas.width=viewport.width

page.render({

canvasContext:ctx,
viewport

})

document.getElementById("pageInfo")
.innerText=`${num} / ${pdfDoc.numPages}`

})

}

function prevPage(){

if(pageNum<=1)return

pageNum--

renderPage(pageNum)

}

function nextPage(){

if(pageNum>=pdfDoc.numPages)return

pageNum++

renderPage(pageNum)

}

/* 目录 */

function loadTOC(){

pdfDoc.getOutline().then(outline=>{

const toc=document.getElementById("toc")

toc.innerHTML=""

function create(item,parent){

const a=document.createElement("a")

a.textContent=item.title

a.onclick=()=>{

pdfDoc.getDestination(item.dest)
.then(dest=>pdfDoc.getPageIndex(dest[0]))
.then(index=>{

pageNum=index+1
renderPage(pageNum)

})

}

parent.appendChild(a)

if(item.items){

item.items.forEach(i=>create(i,parent))

}

}

outline.forEach(i=>create(i,toc))

})

}

/* 搜索 */

function search(){

const q=document.getElementById("searchBox")
.value.toLowerCase()

document.querySelectorAll("#toc a")
.forEach(a=>{

a.style.display=
a.textContent.toLowerCase().includes(q)
?"block":"none"

})

}

loadFolders()

</script>

</body>

</html>
