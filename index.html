<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>软件帮助中心</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#f5f6fa;
overflow:hidden;
}

/* 顶部导航 */

.header{

height:55px;
background:#0d1117;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:16px;
position:relative;
}

.currentPDF{

font-weight:600;

}

/* 左侧栏 */

.sidebar{

position:fixed;
top:55px;
left:0;
bottom:0;
width:260px;
background:white;
border-right:1px solid #ddd;
overflow:auto;
transition:.3s;
z-index:1000;

}

.sidebar.hidden{

transform:translateX(-260px);

}

/* 折叠按钮 */

.toggleBtn{

position:fixed;
top:70px;
left:20px;
width:50px;
height:50px;
background:white;
border-radius:12px;
box-shadow:0 4px 20px rgba(0,0,0,0.15);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
z-index:2000;
transition:.3s;

}

.toggleBtn:hover{

transform:scale(1.05);

}

.toggleBtn span{

display:block;
width:20px;
height:2px;
background:#333;
margin:3px 0;

}

/* 目录 */

.toc{

position:fixed;
top:55px;
left:260px;
width:260px;
bottom:0;
background:#fafafa;
border-right:1px solid #ddd;
overflow:auto;
transition:.3s;

}

.toc.hidden{

transform:translateX(-260px);

}

/* 主区域 */

.viewer{

margin-left:520px;
margin-top:55px;
height:calc(100vh - 55px);
overflow:auto;
background:#525659;
text-align:center;
transition:.3s;

}

.sidebar.hidden + .toc + .viewer{

margin-left:0;

}

/* PDF画布 */

canvas{

margin:20px auto;
box-shadow:0 5px 25px rgba(0,0,0,0.4);

}

/* 左右翻页按钮 */

.pageArrow{

position:fixed;
top:50%;
transform:translateY(-50%);
width:50px;
height:80px;
background:rgba(0,0,0,0.3);
color:white;
font-size:30px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
border-radius:6px;

}

.leftArrow{

left:520px;

}

.rightArrow{

right:20px;

}

/* 加载动画 */

.loading{

position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:white;
font-size:18px;

}

/* 首页 */

.home{

display:flex;
align-items:center;
justify-content:center;
height:100%;
color:white;
font-size:24px;

}

/* 搜索 */

.search{

width:90%;
margin:10px;
padding:6px;
border-radius:6px;
border:1px solid #ddd;

}

a{

display:block;
padding:6px 10px;
cursor:pointer;

}

a:hover{

background:#eee;

}

.active{

background:#e6f3ff;
border-left:3px solid #0078ff;

}

</style>

</head>

<body>

<div class="header">

<div class="currentPDF" id="currentPDF">

软件帮助中心

</div>

</div>

<div class="toggleBtn" onclick="toggleSidebar()">

<span></span>
<span></span>
<span></span>

</div>

<div class="sidebar">

<input class="search" id="searchBox" placeholder="搜索">

<div id="softwareList"></div>

</div>

<div class="toc">

<div id="toc"></div>

</div>

<div class="viewer" id="viewer">

<div class="home" id="home">

请选择左侧软件帮助文档

</div>

<canvas id="pdfCanvas"></canvas>

</div>

<div class="pageArrow leftArrow" onclick="prevPage()">

‹

</div>

<div class="pageArrow rightArrow" onclick="nextPage()">

›

</div>

<script>

const owner="zhang1394725324"
const repo="SoftwareHelpDoc"
const branch="main"

let pdfDoc=null
let pageNum=1
let scale=1.2

pdfjsLib.GlobalWorkerOptions.workerSrc=
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'

function toggleSidebar(){

document.querySelector(".sidebar").classList.toggle("hidden")
document.querySelector(".toc").classList.toggle("hidden")

}

/* 自动扫描 */

async function loadFolders(){

const res=await fetch(
`https://api.github.com/repos/${owner}/${repo}/contents`
)

const data=await res.json()

data.forEach(folder=>{

if(folder.type=="dir"){

loadPDFs(folder.name)

}

})

}

async function loadPDFs(folder){

const res=await fetch(
`https://api.github.com/repos/${owner}/${repo}/contents/${folder}`
)

const files=await res.json()

const list=document.getElementById("softwareList")

const title=document.createElement("h3")

title.textContent=folder

list.appendChild(title)

files.forEach(file=>{

if(file.name.endsWith(".pdf")){

const a=document.createElement("a")

a.textContent=file.name

a.onclick=()=>loadPDF(file.download_url,file.name,a)

list.appendChild(a)

}

})

}

/* 加载PDF */

function loadPDF(url,name,link){

document.getElementById("home").style.display="none"

document.querySelectorAll(".sidebar a")
.forEach(a=>a.classList.remove("active"))

link.classList.add("active")

document.getElementById("currentPDF").innerText=name

pdfjsLib.getDocument(url).promise.then(pdf=>{

pdfDoc=pdf
pageNum=1

renderPage(pageNum)
loadTOC()

})

}

/* 渲染 */

function renderPage(num){

pdfDoc.getPage(num).then(page=>{

const canvas=document.getElementById("pdfCanvas")

const ctx=canvas.getContext("2d")

const viewport=page.getViewport({scale})

canvas.height=viewport.height
canvas.width=viewport.width

page.render({

canvasContext:ctx,
viewport

})

})

}

/* 翻页 */

function prevPage(){

if(pageNum<=1)return

pageNum--

renderPage(pageNum)

}

function nextPage(){

if(pageNum>=pdfDoc.numPages)return

pageNum++

renderPage(pageNum)

}

/* 目录 */

function loadTOC(){

pdfDoc.getOutline().then(outline=>{

const toc=document.getElementById("toc")

toc.innerHTML=""

function create(item,parent){

const a=document.createElement("a")

a.textContent=item.title

a.onclick=()=>{

pdfDoc.getDestination(item.dest)
.then(dest=>pdfDoc.getPageIndex(dest[0]))
.then(index=>{

pageNum=index+1

renderPage(pageNum)

})

}

parent.appendChild(a)

if(item.items){

item.items.forEach(i=>create(i,parent))

}

}

outline.forEach(i=>create(i,toc))

})

}

/* 搜索 */

document.getElementById("searchBox")
.addEventListener("input",function(){

const q=this.value.toLowerCase()

document.querySelectorAll(".sidebar a")
.forEach(a=>{

a.style.display=
a.textContent.toLowerCase().includes(q)
?"block":"none"

})

})

loadFolders()

</script>

</body>

</html>
