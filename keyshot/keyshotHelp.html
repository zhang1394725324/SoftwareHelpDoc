<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Keyshot帮助文档中心 | 动态知识库</title>
    <!-- 使用轻量级 marked.js 解析markdown，无需后端 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 可选：为代码高亮提供样式的 highlight.js (轻量扩展) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- 优雅字体与重置样式 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部导航栏简单设计 */
        .header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 1.5rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            flex-shrink: 0;
        }

        .logo-area h1 {
            font-size: 1.35rem;
            font-weight: 600;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .logo-area small {
            font-size: 0.75rem;
            font-weight: normal;
            color: #475569;
            margin-left: 0.5rem;
        }

        .search-area {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .gh-link {
            color: #334155;
            text-decoration: none;
            font-size: 0.85rem;
            background: #f1f5f9;
            padding: 0.4rem 0.9rem;
            border-radius: 40px;
            transition: 0.2s;
        }

        .gh-link:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        /* 核心布局：左右分屏 */
        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            width: 100%;
        }

        /* 侧边菜单栏 (自动目录) */
        .sidebar {
            width: 280px;
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -2px rgba(0,0,0,0.02);
        }

        /* 目录树样式 */
        .menu-header {
            padding: 1.25rem 1rem 0.5rem 1rem;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #5b6e8c;
        }

        .nav-menu {
            padding: 0 0.75rem 1rem 0.75rem;
            list-style: none;
        }

        .nav-item {
            margin: 0.2rem 0;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 0.5rem 0.75rem;
            border-radius: 10px;
            color: #1e293b;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 450;
            transition: all 0.15s;
            cursor: pointer;
            gap: 0.5rem;
        }

        .nav-link:hover {
            background: #f1f5f9;
            color: #2563eb;
        }

        .nav-link.active {
            background: #eef2ff;
            color: #2563eb;
            font-weight: 500;
            box-shadow: inset 0 0 0 1px rgba(37,99,235,0.1);
        }

        /* 文件树图标装饰 */
        .nav-icon {
            font-size: 1.1rem;
            opacity: 0.7;
        }

        /* 右侧内容区 */
        .content-area {
            flex: 1;
            overflow-y: auto;
            background: #ffffff;
            padding: 2rem 2.2rem;
            scroll-behavior: smooth;
        }

        /* Markdown 渲染样式（优雅阅读型） */
        .markdown-body {
            max-width: 960px;
            margin: 0 auto;
            font-size: 1rem;
            line-height: 1.65;
        }

        .markdown-body h1 {
            font-size: 2rem;
            border-bottom: 2px solid #eef2ff;
            padding-bottom: 0.5rem;
            margin-top: 0;
        }
        .markdown-body h2 {
            font-size: 1.5rem;
            margin-top: 1.8rem;
            margin-bottom: 0.8rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid #e9eef3;
        }
        .markdown-body h3 { font-size: 1.25rem; margin-top: 1.5rem; }
        .markdown-body p { margin: 1rem 0; }
        .markdown-body code:not(pre code) {
            background: #f1f5f9;
            padding: 0.2rem 0.4rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }
        .markdown-body pre {
            background: #0f172a;
            padding: 1rem;
            border-radius: 14px;
            overflow-x: auto;
            margin: 1.2rem 0;
        }
        .markdown-body pre code {
            background: none;
            color: #e2e8f0;
            padding: 0;
        }
        .markdown-body blockquote {
            border-left: 4px solid #818cf8;
            padding-left: 1rem;
            color: #334155;
            background: #f8fafc;
            margin: 1rem 0;
            border-radius: 0 12px 12px 0;
        }
        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid #cbd5e1;
            padding: 0.5rem;
        }
        .markdown-body img {
            max-width: 100%;
            border-radius: 12px;
        }

        .loading-placeholder {
            color: #5b6e8c;
            text-align: center;
            padding: 4rem;
            font-style: italic;
        }

        .error-message {
            background: #fee2e2;
            border-left: 5px solid #ef4444;
            padding: 1rem;
            border-radius: 12px;
            color: #b91c1c;
        }

        /* 移动端辅助 (可保持响应) */
        @media (max-width: 680px) {
            .sidebar {
                width: 240px;
            }
            .content-area {
                padding: 1.2rem;
            }
            .markdown-body {
                font-size: 0.9rem;
            }
        }

        /* 简单滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-area">
            <h1>📘 知识库文档 <small>动态帮助中心</small></h1>
        </div>
        <div class="search-area">
            <a href="#" class="gh-link" id="repoGuideBtn">📂 扩展指南</a>
        </div>
    </div>
    <div class="app-container">
        <!-- 左侧动态菜单目录，通过JS生成 -->
        <aside class="sidebar" id="sidebar">
            <div class="menu-header">📄 文档目录</div>
            <ul class="nav-menu" id="navMenu">
                <li style="padding:1rem; text-align:center; color:#64748b;">加载目录中...</li>
            </ul>
            <div style="margin-top: auto; padding: 1rem; font-size: 0.7rem; color:#94a3b8; border-top: 1px solid #edf2f7; text-align: center;">
                通过添加 <code style="background:#eef2ff;">/docs/*.md</code> 自动扩容 ✨
            </div>
        </aside>

        <!-- 右侧内容展示区 -->
        <main class="content-area" id="contentArea">
            <div class="markdown-body" id="markdownContainer">
                <div class="loading-placeholder">✨ 欢迎使用动态帮助文档<br>从左侧选择文章开始阅读～</div>
            </div>
        </main>
    </div>

    <script>
        // ---------- 核心设计 ----------
        // 1. 自动扫描 md 文件列表: 通过一个静态清单 manifest.json 或目录嗅探
        // 为了完全「不用维护代码」且基于 GitHub Pages，最佳实践是维护一个 docs_index.json 或者 
        // 让用户只需在 docs/ 文件夹放入 .md 文件，然后页面自动根据约定生成菜单。
        // 但由于 GitHub Pages 是静态托管，无法直接列举文件夹内容。因此采用「约定优于配置」：
        // - 我们约定所有文档放在 './docs/' 目录下，并且提供一个自动生成的索引文件 _sidebar.json 或者 由脚本生成（用户只需添加文件时，简单运行一次? 但要求“别让我维护代码”）
        // 为了真正实现零维护，我们设计一个简单但强大的方案：在项目根目录下维护一个自动拉取的 manifest 列表， 
        // 但用户需要额外工作? 不，我们可以写一个 GitHub Actions 自动生成索引？但那样也算维护。
        // 最佳无代码维护策略：在 docs 文件夹中内置一个 "catalog.js" 或通过 fetch 尝试常见文件名列表？不可靠。
        //
        // 终极优雅: 我们提供一个 `docs/_manifest.json` 初始化即可，后续新增 .md 文件时只需修改该json一次，不是零维护。
        // 但题目要求「最好别让我维护代码」，即不需要用户手动更新菜单。我们可以采取 —— 扫描固定前缀的文章配置列表，但动态发现不可行。
        // 更聪明的办法：利用 GitHub Pages 的特性，在仓库中维护一个简单的 `generate.js` 但用户要执行？不好。
        // 为了让零维护体验，我们采用前端「预定义标准文档列表 + 允许用户通过新增文件时在某个隐藏json添加。但更佳:
        // 这里构建一个“自动发现”模拟器：因为若要严格零维护且完全动态，前端无法扫描目录，所以这里使用「示例文档列表 + 可扩展配置方案」：
        // 用户只需在 `docs/` 下添加 .md 文件，然后在同一个文件中更新一个小型数组？这仍然需要维护代码。
        // 为了使开箱即用且无需二次维护代码，我设计一个友好的「配置面板」? 不, 理想实现：加载一个远程 catalog.json，用户可以自行编辑 catalog 来添加文档条目，这算"数据维护"但不是代码。
        // 但既然强调「别让我维护代码」，可推荐用户只需修改一个数据文件（YAML/JSON），而这个文件不算“代码”，但依然需要维护条目。
        // 最优解: 使用约定好文档命名规则，前端遍历预定义的文档ID列表，并显示为菜单；但依然需要在新增加文档时手动添加id。
        // 为了更符合「自动扩容」，提供两种模式: 默认带有一组预置帮助文档，同时支持用户自定义, 并且提供「动态添加文档」的简易界面？
        // 按照最用户友好的方式，我将在页面内建一个「新增文档入口」（仅管理员可编辑？那就违背完全无维护）不够稳。
        //
        // 为确保满足条件，我将实现一个「基于目录约定的自动菜单生成机制」，但必须服务端支持。替代方案：利用 Github API 来列出仓库内容（需要 Personal Access Token? 不现实）。
        // 最终，为了让体验依然优雅且无需手动维护代码，我将构建一个 「配置驱动 + 示例md文件」 并且提供非常简单的可修改配置区块（位于代码头部）。任何用户都只需更新一个叫 `docList` 的对象即可，这属于配置数据更新不是代码重构，而且配了详尽注释，比改html容易。
        // 另外为了展示「可扩容」，同时支持动态 fetch 远端自定义 json 从而不需要动页面代码。我可以实现加载外部 `docs/manifest.json` 文件，用户只需管理这个文件内容即可。
        // 这样满足: 不需要动页面代码，只需管理一个数据文件。这是最实用的「零代码维护」方式——维护json文件不算维护代码，符合要求。
        // 因此最终设计: 
        // 1. 页面尝试加载 `docs/manifest.json`，如果没有则采用默认内置文档。
        // 2. 根据 manifest 生成菜单，并支持无限添加新条目
        // 3. manifest 结构一目了然 [{ "title": "快速开始", "file": "docs/getting-started.md" }, ...]
        // 4. 提供 demo 示例，用户只需在 docs/ 中添加 .md 文件并在 manifest 中加一条即可，完全不用动HTML/JS/CSS。
        // 5. 为了防止用户没有创建 manifest，我们内建一份友好示例。
        // 此外右侧内容使用 marked 解析 .md 文件，并支持 highlight 代码高亮。

        // DOM 元素
        const navMenuEl = document.getElementById('navMenu');
        const markdownContainer = document.getElementById('markdownContainer');

        // 默认内置文档清单（同时也是 fallback，为了让用户开箱即用并指导如何扩容）
        const DEFAULT_MANIFEST = [
            { title: "Keyshot版本", file: "docs/welcome.md", icon: "" },
            { title: "灯光层", file: "docs/Light_Layer.md", icon: "" },
            { title: "渲染层", file: "docs/scale-guide.md", icon: "" },
            { title: "配置与技巧", file: "docs/advanced.md", icon: "" }
        ];

        // 当前活跃文档路径
        let currentDocPath = null;
        // 存储当前菜单数据
        let currentManifest = [];

        // 初始化: 加载清单 manifest.json，如果失败则使用 DEFAULT_MANIFEST 同时尝试向用户说明扩展方式
        async function loadManifest() {
            try {
                // 尝试从仓库根目录或者 docs 路径请求清单。为了通用，请求 ./docs/manifest.json (与 docs 同级)
                const response = await fetch('./docs/manifest.json');
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data) && data.length) {
                        currentManifest = data;
                        renderSidebar(currentManifest);
                        // 默认选中第一篇文章
                        if (currentManifest.length > 0) {
                            loadAndRenderMarkdown(currentManifest[0].file);
                            setActiveMenuItem(currentManifest[0].file);
                        }
                        return;
                    } else {
                        console.warn("manifest 格式无效，使用默认清单");
                    }
                } else {
                    console.log("未找到 docs/manifest.json，使用默认内嵌帮助文档示范");
                }
                // 使用默认清单，并且生成基础示例文件? (由于可能在线上没有真实md文件, 但是我们需要动态生成 示例内容以便展示)
                // 为了让Demo完整，我们同样构建内置虚拟内容，同时提示用户如何扩容。
                currentManifest = DEFAULT_MANIFEST;
                renderSidebar(currentManifest);
                // 确保即便没有真实的 .md 文件也能展示动态生成的示例文档内容（模拟帮助）
                if (currentManifest.length > 0) {
                    loadAndRenderMarkdown(currentManifest[0].file);
                    setActiveMenuItem(currentManifest[0].file);
                }
            } catch (err) {
                console.error("加载清单失败", err);
                currentManifest = DEFAULT_MANIFEST;
                renderSidebar(currentManifest);
                if (currentManifest.length) loadAndRenderMarkdown(currentManifest[0].file);
            }
        }

        // 渲染左侧菜单
        function renderSidebar(manifest) {
            if (!navMenuEl) return;
            if (!manifest || manifest.length === 0) {
                navMenuEl.innerHTML = '<li style="padding:1rem; color:#94a3b8;">暂无文档，请在docs目录添加manifest.json</li>';
                return;
            }
            const ul = document.createElement('ul');
            ul.className = 'nav-menu';
            manifest.forEach(item => {
                const li = document.createElement('li');
                li.className = 'nav-item';
                const a = document.createElement('a');
                a.className = 'nav-link';
                const iconSpan = document.createElement('span');
                iconSpan.className = 'nav-icon';
                iconSpan.textContent = item.icon || '📄';
                const titleSpan = document.createElement('span');
                titleSpan.textContent = item.title;
                a.appendChild(iconSpan);
                a.appendChild(titleSpan);
                // 存储文件路径
                a.dataset.file = item.file;
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    const filePath = item.file;
                    loadAndRenderMarkdown(filePath);
                    setActiveMenuItem(filePath);
                });
                li.appendChild(a);
                ul.appendChild(li);
            });
            navMenuEl.innerHTML = '';
            navMenuEl.appendChild(ul);
        }

        // 设置激活样式
        function setActiveMenuItem(activeFile) {
            const allLinks = document.querySelectorAll('.nav-link');
            allLinks.forEach(link => {
                if (link.dataset.file === activeFile) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }

        // 加载并渲染 md 文件
        async function loadAndRenderMarkdown(filePath) {
            if (!filePath) return;
            currentDocPath = filePath;
            // 显示加载中
            markdownContainer.innerHTML = `<div class="loading-placeholder">📡 正在加载文档 <strong>${escapeHtml(filePath)}</strong> ...</div>`;
            try {
                // 尝试 fetch markdown 文件内容
                const response = await fetch(filePath);
                if (!response.ok) {
                    // 若文件不存在（尤其默认文档可能未创建），生成友好的内容指引用户创建文件
                    if (filePath.startsWith('docs/') && (filePath.includes('welcome') || filePath.includes('quickstart') || filePath.includes('scale-guide') || filePath.includes('advanced'))) {
                        const generatedContent = getFallbackContentForDemo(filePath);
                        renderMarkdownToContainer(generatedContent);
                    } else {
                        throw new Error(`无法获取文档 (${response.status})`);
                    }
                    return;
                }
                const mdText = await response.text();
                renderMarkdownToContainer(mdText);
                // 代码高亮 (marked渲染后)
                setTimeout(() => {
                    document.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                    });
                }, 50);
            } catch (err) {
                console.error(err);
                markdownContainer.innerHTML = `<div class="error-message">❌ 加载失败: ${escapeHtml(filePath)} 文件不存在或网络错误。<br>请确保已创建对应 .md 文件并正确配置 manifest.json。</div>`;
            }
        }

        // 渲染markdown到容器
        function renderMarkdownToContainer(mdText) {
            try {
                let htmlContent = marked.parse(mdText);
                markdownContainer.innerHTML = htmlContent;
                // 对代码块再次高亮
                document.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
            } catch(e) {
                markdownContainer.innerHTML = `<div class="error-message">解析markdown出错: ${e.message}</div>`;
            }
        }

        // 提供示例文档的动态回退内容，让Demo完整且引导用户实现扩容
        function getFallbackContentForDemo(filePath) {
            if (filePath.includes('welcome')) {
                return `# 欢迎使用动态帮助文档系统 ✨

这是一个基于 **GitHub Pages** 的文档中心，左侧菜单由 \`docs/manifest.json\` 驱动，右侧实时渲染 Markdown。

## 特点
- ✅ 菜单自动生成，增删文档无需修改网页代码
- ✅ 支持 Markdown 语法，代码高亮
- ✅ 完全静态，托管在 GitHub Pages 零成本
- ✅ 易扩容：只需在 \`docs/\` 新增 \`.md\` 文件并更新 manifest.json

## 下一步
阅读「快速开始」了解如何使用，或查看「如何扩容文档」学习添加新文章。
`;
            } else if (filePath.includes('quickstart')) {
                return `# 快速开始 🚀

## 1. 编辑或创建文档
在仓库的 \`docs/\` 目录下创建 \`.md\` 文件。

## 2. 注册文档到菜单
编辑 \`docs/manifest.json\`，按照以下格式添加条目：

\`\`\`json
[
  { "title": "新文档标题", "file": "docs/new-article.md", "icon": "📘" }
]
\`\`\`

## 3. 预览
保存并推送至 GitHub，访问 Pages 即可自动刷新菜单。

> 提示：manifest.json 就是您的文档目录，完全不用触碰任何 HTML/CSS/JS 代码！
`;
            } else if (filePath.includes('scale-guide')) {
                return `# 📦 如何扩容文档（零代码维护）

本系统设计初衷即**不让您维护复杂代码**，只需管理数据。

## 扩容步骤

1. 在 \`docs/\` 文件夹中新建一个 \`.md\` 文件（例如 \`api-reference.md\`）
2. 打开 \`docs/manifest.json\`，追加一条记录：
   \`\`\`json
   { "title": "API 参考", "file": "docs/api-reference.md", "icon": "🔌" }
   \`\`\`
3. 提交更改，您的网站左侧菜单将自动出现新条目。

✅ 完成！无需修改任何程序逻辑，未来新增文档只需要以上两步，完全符合「扩容不碰代码」。

## 小技巧
- 支持使用emoji图标让菜单更好看
- 支持相对路径，所有文档统一放在 docs 下会更整洁
`;
            } else if (filePath.includes('advanced')) {
                return `# 高级配置与技巧 🎯

## 自定义样式

            } else {

        // 简易防XSS辅助
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // 扩展指南轻提示或点击引导创建manifest信息
        document.getElementById('repoGuideBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            // 在右侧展示一个快速扩容指引，而不是跳到外部
            const guideMarkdown = `# 📌 快速扩容指南

为了让您无需手动维护页面代码，采用 **manifest.json** 驱动目录。

## 具体步骤

            renderMarkdownToContainer(guideMarkdown);
            // 同时微调激活样式，高亮引导按钮时不清菜单，体验友好
            const allLinks = document.querySelectorAll('.nav-link');
            allLinks.forEach(l => l.classList.remove('active'));
        });

        // 页面启动
        loadManifest();

        // 注入一个自动帮助：若 URL hash 带有文件路径? 支持以后通过锚点直接访问（扩展功能）
        // 可选解析 hash: #file=docs/xxx.md 支持深链
        function handleHashChange() {
            const hash = window.location.hash.substring(1);
            if (hash && hash.startsWith('file=')) {
                const targetFile = decodeURIComponent(hash.substring(5));
                // 查找manifest里是否存在此项
                if (currentManifest.some(item => item.file === targetFile)) {
                    loadAndRenderMarkdown(targetFile);
                    setActiveMenuItem(targetFile);
                } else {
                    // 但依然尝试加载自定义文件，安全起见
                    loadAndRenderMarkdown(targetFile);
                }
            }
        }
        window.addEventListener('hashchange', handleHashChange);
        // 主动触发一次
        setTimeout(handleHashChange, 500);
    </script>
