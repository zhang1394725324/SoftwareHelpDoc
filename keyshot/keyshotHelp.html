<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Keyshot帮助文档中心</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 1.5rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .logo-area h1 {
            font-size: 1.35rem;
            font-weight: 600;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .gh-link {
            color: #334155;
            text-decoration: none;
            font-size: 0.85rem;
            background: #f1f5f9;
            padding: 0.4rem 0.9rem;
            border-radius: 40px;
            transition: 0.2s;
        }

        .gh-link:hover {
            background: #e2e8f0;
        }

        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .menu-header {
            padding: 1.25rem 1rem 0.5rem 1rem;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #5b6e8c;
        }

        .nav-menu {
            padding: 0 0.75rem 1rem 0.75rem;
            list-style: none;
        }

        .nav-item {
            margin: 0.2rem 0;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 0.5rem 0.75rem;
            border-radius: 10px;
            color: #1e293b;
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            gap: 0.5rem;
        }

        .nav-link:hover {
            background: #f1f5f9;
            color: #2563eb;
        }

        .nav-link.active {
            background: #eef2ff;
            color: #2563eb;
            font-weight: 500;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            background: #ffffff;
            padding: 2rem 2.2rem;
        }

        .markdown-body {
            max-width: 960px;
            margin: 0 auto;
            font-size: 1rem;
            line-height: 1.65;
        }

        .markdown-body h1 {
            font-size: 2rem;
            border-bottom: 2px solid #eef2ff;
            padding-bottom: 0.5rem;
        }
        .markdown-body h2 {
            font-size: 1.5rem;
            margin-top: 1.8rem;
            border-bottom: 1px solid #e9eef3;
        }
        .markdown-body code:not(pre code) {
            background: #f1f5f9;
            padding: 0.2rem 0.4rem;
            border-radius: 6px;
        }
        .markdown-body pre {
            background: #0f172a;
            padding: 1rem;
            border-radius: 14px;
            overflow-x: auto;
        }
        .markdown-body pre code {
            background: none;
            color: #e2e8f0;
        }
        .markdown-body blockquote {
            border-left: 4px solid #818cf8;
            padding-left: 1rem;
            color: #334155;
            background: #f8fafc;
        }
        .markdown-body img {
            max-width: 100%;
            border-radius: 12px;
        }

        .loading-placeholder {
            color: #5b6e8c;
            text-align: center;
            padding: 4rem;
        }

        .error-message {
            background: #fee2e2;
            border-left: 5px solid #ef4444;
            padding: 1rem;
            border-radius: 12px;
            color: #b91c1c;
        }

        @media (max-width: 680px) {
            .sidebar { width: 240px; }
            .content-area { padding: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-area">
            <h1>Keyshot文档 <small>帮助中心</small></h1>
        </div>
        <div class="search-area">
            <a href="#" class="gh-link" id="repoGuideBtn">📂指南</a>
        </div>
    </div>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="menu-header">📄 文档目录</div>
            <ul class="nav-menu" id="navMenu">
                <li style="padding:1rem; text-align:center;">加载目录中...</li>
            </ul>
            <div style="margin-top: auto; padding: 1rem; font-size: 0.7rem; color:#94a3b8; border-top: 1px solid #edf2f7; text-align: center;">
                通过添加 <code style="background:#eef2ff;">/docs/*.md</code> 自动扩容 ✨
            </div>
        </aside>

        <main class="content-area" id="contentArea">
            <div class="markdown-body" id="markdownContainer">
                <div class="loading-placeholder">✨ 欢迎使用动态帮助文档<br>从左侧选择文章开始阅读～</div>
            </div>
        </main>
    </div>

     <script>
        const navMenuEl = document.getElementById('navMenu');
        const markdownContainer = document.getElementById('markdownContainer');
        
        const DEFAULT_MANIFEST = [
            { title: "🏠 欢迎与介绍", file: "docs/welcome.md", icon: "📖" },
            { title: "🚀 快速开始", file: "docs/quickstart.md", icon: "⚡" }
        ];
        
        let currentManifest = [];
        
        async function loadManifest() {
            try {
                const res = await fetch('./docs/manifest.json');
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length) currentManifest = data;
                    else currentManifest = DEFAULT_MANIFEST;
                } else currentManifest = DEFAULT_MANIFEST;
                renderSidebar(currentManifest);
                if (currentManifest.length) loadAndRenderMarkdown(currentManifest[0].file);
            } catch(e) { currentManifest = DEFAULT_MANIFEST; renderSidebar(currentManifest); }
        }
        
        function renderSidebar(manifest) {
            if (!manifest?.length) { navMenuEl.innerHTML = '<li style="padding:1rem;">暂无文档</li>'; return; }
            const ul = document.createElement('ul');
            ul.className = 'nav-menu';
            manifest.forEach(item => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.className = 'nav-link';
                a.innerHTML = `<span>${item.icon || '📄'}</span><span>${item.title}</span>`;
                a.dataset.file = item.file;
                a.onclick = (e) => { e.preventDefault(); loadAndRenderMarkdown(item.file); setActive(item.file); };
                li.appendChild(a);
                ul.appendChild(li);
            });
            navMenuEl.innerHTML = ''; navMenuEl.appendChild(ul);
        }
        
        function setActive(file) {
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.dataset.file === file) link.classList.add('active');
                else link.classList.remove('active');
            });
        }
        
        // ✅ 修正版：图片路径转换（不加额外/docs前缀）
        function fixImagePaths(mdText, mdFilePath) {
            const lastSlash = mdFilePath.lastIndexOf('/');
            const mdDir = lastSlash !== -1 ? mdFilePath.substring(0, lastSlash + 1) : '';
            
            return mdText.replace(/!\[([^\]]*)\]\((?!https?:\/\/|\/)([^)]+)\)/g, (match, alt, src) => {
                let correctedSrc = mdDir + src;
                // 处理 ../ 和 ./
                const parts = correctedSrc.split('/');
                const stack = [];
                for (const part of parts) {
                    if (part === '.' || part === '') continue;
                    if (part === '..') { if (stack.length) stack.pop(); }
                    else stack.push(part);
                }
                correctedSrc = stack.join('/');
                return `![${alt}](${correctedSrc})`;
            });
        }
        
        async function loadAndRenderMarkdown(filePath) {
            if (!filePath) return;
            markdownContainer.innerHTML = '<div class="loading-placeholder">加载中...</div>';
            try {
                const res = await fetch(filePath);
                if (!res.ok) throw new Error();
                let md = await res.text();
                md = fixImagePaths(md, filePath);
                markdownContainer.innerHTML = marked.parse(md);
                document.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
            } catch(e) {
                markdownContainer.innerHTML = `<div class="error-message">❌ 文档不存在: ${filePath}</div>`;
            }
        }
        
        document.getElementById('repoGuideBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            const guide = `# 相对路径图片使用指南

## 目录结构示例
\`\`\`
仓库根目录/
├── images/          ← 图片放在这里
│   └── logo.png
└── docs/
    └── welcome.md
\`\`\`

## 在 welcome.md 中写
\`\`\`markdown
![Logo](images/logo.png)
\`\`\`

✅ 自动转换为 \`images/logo.png\`（正确）

> 不再强制添加 /docs/ 前缀！`;
            markdownContainer.innerHTML = marked.parse(guide);
        });
        
        loadManifest();
    </script>
</body>
</html>
